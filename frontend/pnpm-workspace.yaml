# pnpm settings. Since pnpm 11, these live here instead of the package.json
# "pnpm" field (which pnpm 11 silently ignores).

# CVE-pinning overrides for transitive dependencies.
overrides:
  minimatch: '>=10.2.1'
  picomatch: '>=4.0.4'
  brace-expansion: '>=5.0.6'
  dompurify: '>=3.4.11'
  protobufjs: '>=8.6.0'
  js-cookie: '>=3.0.7'
  esbuild: '>=0.28.1'
  # Caret-bounded on purpose. vite is a DIRECT dependency, so an unbounded
  # '>=' here lets `pnpm update` resolve vite 8 and rewrite package.json to
  # match, which is how a major slipped into an automated refresh.
  vite: '^7.3.6'
  postcss: '>=8.5.23'   # GHSA-r28c-9q8g-f849, GHSA-fxqj-rqcc-2cmp
  nanoid: '>=3.3.18'    # GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8
  '@babel/core': '>=7.29.6'
  markdown-it: '>=14.2.0'
  '@opentelemetry/core': '>=2.8.0'
  linkify-it: '>=5.0.1'

# pnpm 11 ignores dependency build scripts unless explicitly allowed here.
allowBuilds:
  esbuild: true # fetches its platform binary — required for the vite build
  '@clerk/shared': true
  core-js: false # postinstall is only a funding notice