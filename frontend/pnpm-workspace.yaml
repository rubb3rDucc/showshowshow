# pnpm settings. Since pnpm 11, these live here instead of the package.json
# "pnpm" field (which pnpm 11 silently ignores).

# Overrides are for TRANSITIVE packages only.
#
# Never add an override for something that is also a direct dependency here.
# The two disagree the moment `pnpm update` rewrites the manifest range, and
# `--frozen-lockfile` then refuses to install with a mismatch naming a package
# nobody touched. vite and postcss were both removed for exactly that reason;
# their own ranges in package.json already exceed the advisory floors.
overrides:
  minimatch: '>=10.2.1'
  picomatch: '>=4.0.4'
  brace-expansion: '>=5.0.12 <6' # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr
  dompurify: '>=3.4.11'
  protobufjs: '>=8.6.0'
  js-cookie: '>=3.0.7'
  esbuild: '>=0.28.1'
  nanoid: '>=3.3.18'    # GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8
  '@babel/core': '>=7.29.6'
  markdown-it: '>=14.2.0'
  '@opentelemetry/core': '>=2.8.0'
  linkify-it: '>=5.0.1'
  source-map-js: '>=1.2.2 <2' # GHSA-68fv-2mgg-jv7q (via tailwindcss>postcss)
  # GHSA-rj75-hqrm-r3gf, fixed only in 7.1.6. tailwindcss 3 asks for ^6.1.2 and
  # @tailwindcss/typography pins 6.0.10. The 7.0 major only made insertions
  # during iteration safe; tailwind's own postcss-nested already uses ^7.1.4.
  # Built CSS was byte-identical before and after.
  postcss-selector-parser: '>=7.1.6 <8'

# Advisories with no patched release, ignored so the audit job stays useful.
# Revisit when a fix ships.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 stack exhaustion on deeply nested brace patterns. No fixed
    # version exists. Only reached via tailwindcss 3 (chokidar, micromatch,
    # fast-glob) at build time, expanding globs from our own tailwind config.
    # Goes away with a Tailwind 4 migration.
    - GHSA-vfj7-8cjw-p6xm

# pnpm 11 ignores dependency build scripts unless explicitly allowed here.
allowBuilds:
  esbuild: true # fetches its platform binary — required for the vite build
  '@clerk/shared': true
  core-js: false # postinstall is only a funding notice